<style>
  :root {
    --ground:#E9ECEC; --surface:#F6F8F8; --sunken:#E1E6E5;
    --ink:#161B1C; --muted:#5F6C6B; --faint:#8A9695;
    /* 読ませる本文専用。--ink より一段強く、畳んだ行は --muted より一段強く */
    --read:#0D1112; --read-dim:#4A5655;
    --rule:#D2D9D8; --rule-strong:#BAC4C3;
    --accent:#12655A; --accent-soft:rgba(18,101,90,.09);
    --band:#C8D0CF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0F1414; --surface:#161D1C; --sunken:#0A0E0E;
      --ink:#E4E9E8; --muted:#8B9998; --faint:#6B7877;
      --read:#F4F8F7; --read-dim:#AAB7B6;
      --rule:#242E2D; --rule-strong:#384544;
      --accent:#5EC8B6; --accent-soft:rgba(94,200,182,.12);
      --band:#2C3736;
    }
  }
  :root[data-theme="dark"] {
    --ground:#0F1414; --surface:#161D1C; --sunken:#0A0E0E;
    --ink:#E4E9E8; --muted:#8B9998; --faint:#6B7877;
    --read:#F4F8F7; --read-dim:#AAB7B6;
    --rule:#242E2D; --rule-strong:#384544;
    --accent:#5EC8B6; --accent-soft:rgba(94,200,182,.12);
    --band:#2C3736;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{ -webkit-text-size-adjust:100% }
  body{

  .mono{ font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;

  a{ color:inherit }

  .brand em{ font-style:normal; color:var(--accent) }
  .tagline{ font-size:.75rem; color:var(--muted); letter-spacing:.04em; margin-top:.4rem }
  .datenav{ margin-left:auto; display:flex; align-items:center; gap:.5rem }
  .iconbtn{
    font:inherit; cursor:pointer; background:transparent; color:var(--muted);
    border:1px solid var(--rule-strong); border-radius:2px;
    min-width:1.75rem; height:1.75rem; padding:0 .35rem;
    line-height:1; display:grid; place-items:center;
  }
  .iconbtn:hover:not(:disabled){ color:var(--accent); border-color:var(--accent) }

  #dateSelect{

  }
  .today-badge{ font-size:.6rem; letter-spacing:.1em; color:var(--accent);
    border:1px solid var(--accent); border-radius:2px; padding:.1rem .3rem }

  /* ── archive strip ───────────────────────────── */
  .archive{ padding-bottom:1.25rem }
  .archive-head{ display:flex; justify-content:space-between; align-items:baseline;
    font-size:.65rem; letter-spacing:.1em; color:var(--faint); margin-bottom:.4rem }
  .strip{ display:flex; align-items:flex-end; gap:1px; height:2.25rem }
  .strip button{ flex:1; background:var(--band); min-height:2px; border:0; padding:0;
    border-radius:1px 1px 0 0; cursor:pointer; transition:background .12s }
  .strip button:hover{ background:var(--accent) }
  .strip button.is-current{ background:var(--accent) }

  /* ── toolbar ─────────────────────────────────── */
  .toolbar{ position:sticky; top:0; z-index:20; background:var(--ground);

  .chip{
    font:inherit; font-size:.7rem; letter-spacing:.06em; cursor:pointer;
    background:transparent; color:var(--muted);

  }
  .chip:hover{ color:var(--ink); border-color:var(--ink) }
  .chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--surface) }
  .chip .n{ opacity:.65; margin-left:.3rem }
  .toolbar .spacer{ margin-left:auto }

  /* ── ledger ──────────────────────────────────── */
  main{ padding-bottom:4rem; min-height:50vh }
  .ledger{ list-style:none }
  .row{
    display:grid; grid-template-columns:2rem 2.25rem 1fr 4.75rem;
    gap:0 .85rem; align-items:start;
    padding:.7rem 0; border-bottom:1px solid var(--rule);
  }
  .row:hover{ background:var(--accent-soft) }
  .rank{ font-size:.75rem; color:var(--faint); text-align:right; padding-top:.2rem }

  .row[data-open="true"] .src{ color:var(--accent); border-color:var(--accent) }

  .headline{ display:block; font-size:1rem; font-weight:600; line-height:1.55;

  .headline:hover{ color:var(--accent); text-decoration:underline; text-underline-offset:2px }

  .disclose{ font:inherit; text-align:left; cursor:pointer; width:100%;

  .row[data-open="true"] .caret{ transform:rotate(90deg) }
  .row[data-open="true"] .lead{ display:none }

  .detail{ padding-top:.35rem }
  /* 実際に読ませる本文。日本語は 13〜14px だと詰まって読み負荷が上がるので

  .summary{ font-size:1rem; line-height:1.95; color:var(--read); max-width:34em }

  .tags{ display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.55rem }

    .meta{ grid-column:3; text-align:left; display:flex; align-items:center;

    .metatop{ order:1; gap:.6rem }

    .score,.comments{ display:inline }
    .rowacts{ margin-top:0; margin-left:auto; gap:.15rem }

       狭い画面でだけ 44px 角まで広げる */
    .act{ min-width:2.75rem; min-height:2.75rem; font-size:1.05rem;
      display:grid; place-items:center; padding:0 }
    .datenav{ margin-left:0; width:100%; margin-top:.5rem }
  }

</style>

<script>
(() => {
'use strict';

// ページには日付一覧だけを埋め込み、その日の記事は表示するときに取りに行く。
// 全日分を埋め込むとページが際限なく肥大化するため（75日で1.5MBだった）。
const INDEX = JSON.parse(document.getElementById('indexData').textContent);
const DAYS  = INDEX.days;
const DATES = DAYS.map(d => d.d);
const DAYMETA = Object.fromEntries(DAYS.map(d => [d.d, d]));
const cache = new Map();      // date -> articles（取得済み）
const inflight = new Map();   // date -> Promise（取得中）

function loadDay(date) {
  if (cache.has(date)) return Promise.resolve(cache.get(date));
  // 日付を連打すると同じ日に何本もリクエストが飛ぶので、
  // 取得中のものがあればその Promise を使い回す
  if (inflight.has(date)) return inflight.get(date);

  const meta = DAYMETA[date];
  if (!meta) return Promise.resolve([]);

  // v は中身のハッシュ。更新された日だけ再取得される
  const p = fetch('api/' + date + '.json?v=' + meta.v)
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(day => {
      const articles = day.articles || [];
      cache.set(date, articles);
      return articles;
    })
    .finally(() => inflight.delete(date));

  inflight.set(date, p);
  return p;
}

const SRC   = {
  hatena:     { code:'HB', label:'はてブ' },
  hackernews: { code:'HN', label:'HN' },
  reddit:     { code:'RD', label:'Reddit' }
};

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// クロール元のURLは信用できないので http(s) 以外は握りつぶす（javascript: 対策）
const safeUrl = u => {
  try {
    const p = new URL(String(u));           // baseを渡さない = 絶対URL以外は例外にする
    return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : '#';
  } catch (e) { return '#'; }
};

/* ── 保存層 ───────────────────────────────────────
   主キーは id ではなく URL。crawler の旧IDは実行ごとに
   randomize されていて（同一URLに複数IDが実在する）、
   IDで保存すると過去の記事を取りこぼすため。
   localStorage を差し替えれば他のバックエンドにも載せ替えられる。 */
const Store = (() => {
  const KEY = 'signallog:saved:v1';
  let cache = null;

  const load = () => {
    if (cache) return cache;
    try {
      const raw = localStorage.getItem(KEY);
      cache = raw ? JSON.parse(raw) : {};
      if (typeof cache !== 'object' || cache === null || Array.isArray(cache)) cache = {};
    } catch (e) { cache = {}; }
    return cache;
  };
  const persist = () => {
    try { localStorage.setItem(KEY, JSON.stringify(cache)); return true; }
    catch (e) { toast('保存できません（ストレージが一杯か、プライベートモードです）'); return false; }
  };

  return {
    has: url => Object.prototype.hasOwnProperty.call(load(), url),
    get: url => load()[url] || null,
    all: () => Object.values(load()).sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || '')),
    count: () => Object.keys(load()).length,
    add(article, date) {
      const url = safeUrl(article.url);
      if (url === '#') return false;
      load()[url] = {
        url, title: article.title, source: article.source,
        score: article.score || 0, comments: article.comments || 0,
        summary: article.summary || '', tags: article.tags || [],
        date, memo: '', savedAt: new Date().toISOString()
      };
      return persist();
    },
    remove(url) { delete load()[url]; return persist(); },
    setMemo(url, memo) {
      const it = load()[url];
      if (!it) return false;
      it.memo = memo;
      return persist();
    },
    replaceAll(obj) { cache = obj; return persist(); }
  };
})();

/* ── toast ─────────────────────────────────────── */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ── 共有 ──────────────────────────────────────── */
async function shareOrCopy(data, okMsg) {
  // モバイルは OS 標準の共有シート、デスクトップはクリップボードへ
  if (navigator.share) {
    try { await navigator.share(data); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(data.url ? data.url : data.text);
    toast(okMsg);
  } catch (e) { toast('コピーできませんでした'); }
}

/* ── ルーティング ──────────────────────────────
   #/YYYY-MM-DD           … その日
   #/YYYY-MM-DD/hackernews … ソース絞り込み
   #/saved                … 保存済み                    */
// open は「展開中の行のURL」。再描画でDOMを作り直しても
// 展開状態が畳まれないように、状態側に持たせる。
const state = { view: 'day', date: DATES[0], source: 'all', tag: null, open: new Set() };

function parseHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, '')).trim();
  const parts = raw.split('/').filter(Boolean);
  if (parts[0] === 'saved') return { view: 'saved', date: state.date, source: 'all' };
  const date = DATES.includes(parts[0]) ? parts[0] : DATES[0];
  const source = SRC[parts[1]] ? parts[1] : 'all';
  return { view: 'day', date, source };
}
function writeHash(replace) {
  const h = state.view === 'saved'
    ? '#/saved'
    : '#/' + state.date + (state.source !== 'all' ? '/' + state.source : '');
  if (location.hash === h) return;
  if (replace) history.replaceState(null, '', h);
  else location.hash = h;
}
function applyHash() {
  const next = parseHash();
  state.view = next.view; state.date = next.date; state.source = next.source;
  state.tag = null;
  render();
}

/* ── 描画：日次 ────────────────────────────────── */
// 続けて日付を切り替えたとき、遅れて届いた古い応答で
// 画面を上書きしないよう、最新の描画だけを採用する
let renderSeq = 0;

async function render() {
  const seq = ++renderSeq;
  const savedView = state.view === 'saved';
  document.getElementById('savedView').hidden = !savedView;
  document.getElementById('ledger').hidden = savedView;

  document.getElementById('dateSelect').value = state.date;
  document.getElementById('todayBadge').hidden = savedView || state.date !== DATES[0];
  document.getElementById('footerDate').textContent = savedView ? '' : state.date;
  const i = DATES.indexOf(state.date);
  document.getElementById('nextDate').disabled = savedView || i <= 0;
  document.getElementById('prevDate').disabled = savedView || i >= DATES.length - 1;
  [...document.querySelectorAll('#strip button')].forEach(b =>
    b.classList.toggle('is-current', !savedView && b.dataset.date === state.date));

  const empty = document.getElementById('empty');
  let articles = [], failed = false;
  if (cache.has(state.date)) {
    articles = cache.get(state.date);
  } else {
    if (!savedView) {
      document.getElementById('ledger').innerHTML = '';
      empty.hidden = false;
      empty.textContent = '読み込み中…';
    }
    try { articles = await loadDay(state.date); }
    catch (e) { failed = true; }
  }
  if (seq !== renderSeq) return;   // もう次の描画が始まっている

  renderToolbar(articles);
  if (savedView) { renderSaved(); return; }
  if (failed) {
    document.getElementById('ledger').innerHTML = '';
    empty.hidden = false;
    empty.textContent = 'この日のデータを読み込めませんでした。通信状況を確認して再読み込みしてください。';
    return;
  }
  renderDay(articles);
}

function renderToolbar(arts) {
  const counts = arts.reduce((m, a) => (m[a.source] = (m[a.source] || 0) + 1, m), {});
  const chips = [['all', 'ALL', arts.length]]
    .concat(Object.keys(SRC).map(k => [k, SRC[k].label, counts[k] || 0]));
  document.getElementById('toolbar').innerHTML =
    chips.map(([k, l, n]) =>
      '<button class="chip mono" data-src="' + k + '" aria-pressed="' +
      (state.view === 'day' && state.source === k) + '">' + esc(l) +
      '<span class="n">' + n + '</span></button>').join('') +
    '<span class="spacer"></span>' +
    '<button class="chip mono" id="shareDay">この日を共有</button>' +
    '<button class="chip mono" id="savedToggle" aria-pressed="' + (state.view === 'saved') + '">' +
    '&#9733; 保存済み<span class="n">' + Store.count() + '</span></button>';
}

function renderDay(articles) {
  let list = articles.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
  if (state.source !== 'all') list = list.filter(a => a.source === state.source);
  if (state.tag) list = list.filter(a => (a.tags || []).includes(state.tag));

  // スコアはソースごとに桁が違う（HN 986 と はてブ 220 は別スケール）ので、
  // その日・そのソース内の最大値を基準に相対化して初めてバーが意味を持つ。
  const max = {};
  list.forEach(a => { max[a.source] = Math.max(max[a.source] || 0, a.score || 0); });

  document.getElementById('ledger').innerHTML = list.map((a, i) => {
    const m = max[a.source] || 0;
    const w = m > 0 ? Math.round((a.score || 0) / m * 100) : 0;
    const href = safeUrl(a.url);
    const saved = Store.has(href);
    const open = state.open.has(href);
    const id = 'det-' + i;
    return '<li class="row" data-open="' + open + '" data-url="' + esc(href) + '">' +
      '<div class="rank mono">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="src mono">' + esc(SRC[a.source] ? SRC[a.source].code : '??') + '</div>' +
      '<div>' +
        '<a class="headline" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' +
          esc(a.title) + '</a>' +
        (a.summary
          ? '<button class="disclose" aria-expanded="' + open + '" aria-controls="' + id + '">' +
            '<span class="caret mono">&#9656;</span><span class="lead">' + esc(a.summary) + '</span></button>'
          : '') +
        '<div class="detail" id="' + id + '"' + (open ? '' : ' hidden') + '>' +
          (a.summary ? '<p class="summary">' + esc(a.summary) + '</p>' : '') +
          (a.summary_basis === 'title'
            ? '<p class="caveat">本文を取得できなかったため、タイトルだけを元にした要約です</p>' : '') +
          '<div class="tags">' + (a.tags || []).map(t =>
            '<button class="tag" data-tag="' + esc(t) + '" aria-pressed="' +
            (state.tag === t) + '">' + esc(t) + '</button>').join('') + '</div>' +
          (saved ? memoHtml(href) : '') +
        '</div>' +
      '</div>' +
      '<div class="meta">' +
        '<div class="metatop">' +
          '<span class="score mono">' + (a.score || 0) + '</span>' +
          '<div class="rowacts">' +
            '<button class="act save" data-url="' + esc(href) + '" aria-pressed="' + saved + '" ' +
              'title="保存" aria-label="保存">' + (saved ? '&#9733;' : '&#9734;') + '</button>' +
            '<button class="act share" data-url="' + esc(href) + '" title="共有" aria-label="共有">&#8599;</button>' +
          '</div>' +
        '</div>' +
        '<span class="comments mono">' + (a.comments || 0) + ' c</span>' +
        '<div class="bar"><i style="width:' + w + '%"></i></div>' +
      '</div>' +
    '</li>';
  }).join('');

  const empty = document.getElementById('empty');
  empty.hidden = list.length > 0;
  empty.textContent = state.tag
    ? 'タグ「' + state.tag + '」に該当する記事がありません'
    : '該当する記事がありません';
}

function memoHtml(url) {
  const it = Store.get(url);
  return '<div class="memo">' +
    '<label for="memo-' + encodeURIComponent(url) + '">メモ</label>' +
    '<textarea id="memo-' + encodeURIComponent(url) + '" data-url="' + esc(url) + '" ' +
      'placeholder="なぜ保存したか、あとで何を確かめるか">' + esc(it ? it.memo : '') + '</textarea>' +
    '<div class="state" data-for="' + esc(url) + '"></div></div>';
}

/* ── 描画：保存済み ────────────────────────────── */
function renderSaved() {
  const q = document.getElementById('savedSearch').value.trim().toLowerCase();
  let items = Store.all();
  if (q) items = items.filter(it =>
    (it.title + ' ' + (it.summary || '') + ' ' + (it.memo || '') + ' ' + (it.tags || []).join(' '))
      .toLowerCase().includes(q));

  document.getElementById('savedCount').textContent =
    Store.count() + '件' + (q ? ' / 該当 ' + items.length + '件' : '');

  document.getElementById('savedList').innerHTML = items.length === 0
    ? '<p class="empty">' + (q ? '該当する保存記事がありません'
        : '保存した記事はまだありません。記事の <code>&#9734;</code> を押すと、メモを添えてここに残せます。') + '</p>'
    : items.map(it => {
        const href = safeUrl(it.url);
        return '<article class="saved-item">' +
          '<div class="saved-meta mono">' +
            '<span>' + esc(SRC[it.source] ? SRC[it.source].code : '??') + '</span>' +
            '<span>' + esc(it.date || '') + '</span>' +
            '<span>&#9650; ' + (it.score || 0) + '</span>' +
          '</div>' +
          '<a class="headline" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' +
            esc(it.title) + '</a>' +
          (it.summary ? '<p class="summary" style="margin-top:.35rem">' + esc(it.summary) + '</p>' : '') +
          memoHtml(it.url) +
          '<div class="rowacts" style="justify-content:flex-start;margin-top:.5rem">' +
            '<button class="act share" data-url="' + esc(href) + '" title="共有" aria-label="共有">&#8599;</button>' +
            '<button class="act remove" data-url="' + esc(href) + '" title="削除" aria-label="削除">&#10005;</button>' +
          '</div>' +
        '</article>';
      }).join('');

  document.getElementById('empty').hidden = true;
}

/* ── 日付セレクタ / アーカイブ帯 ───────────────── */
function buildChrome() {
  const sel = document.getElementById('dateSelect');
  sel.innerHTML = DATES.map(d => {
    const wd = ['日','月','火','水','木','金','土'][new Date(d + 'T00:00:00').getDay()];
    return '<option value="' + d + '">' + d + ' (' + wd + ')</option>';
  }).join('');

  document.getElementById('dayCount').textContent = DATES.length;

  // 帯に必要な件数と最高スコアは index.json に入っているので、
  // 全日分の記事を読み込まずに描ける
  const asc = DAYS.slice().reverse();
  const peak = Math.max(1, ...asc.map(d => d.top));
  document.getElementById('strip').innerHTML = asc.map(d =>
    '<button data-date="' + d.d + '" style="height:' +
    Math.max(6, Math.round(d.top / peak * 100)) + '%" title="' + d.d +
    ' — ' + d.n + '件 / 最高 ' + d.top + '" aria-label="' + d.d + '"></button>'
  ).join('');
}

/* ── イベント ──────────────────────────────────── */
function go(patch, replace) {
  Object.assign(state, patch);
  writeHash(replace);
  render();
}

document.getElementById('toolbar').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  if (chip.id === 'savedToggle') { go({ view: state.view === 'saved' ? 'day' : 'saved' }); return; }
  if (chip.id === 'shareDay') {
    const meta = DAYMETA[state.date];
    shareOrCopy({
      title: 'Signal/Log ' + state.date,
      text: state.date + ' のITニュース ' + (meta ? meta.n : 0) + '件',
      url: location.origin + location.pathname + '#/' + state.date
    }, 'この日のURLをコピーしました');
    return;
  }
  go({ view: 'day', source: chip.dataset.src });
});

document.getElementById('ledger').addEventListener('click', onListClick);
document.getElementById('savedList').addEventListener('click', onListClick);

function onListClick(e) {
  const save = e.target.closest('.act.save');
  if (save) {
    const url = save.dataset.url;
    if (Store.has(url)) { Store.remove(url); toast('保存を解除しました'); }
    else {
      const a = (cache.get(state.date) || []).find(x => safeUrl(x.url) === url);
      if (a && Store.add(a, state.date)) toast('保存しました');
    }
    render();
    return;
  }
  const rm = e.target.closest('.act.remove');
  if (rm) { Store.remove(rm.dataset.url); toast('削除しました'); render(); return; }

  const sh = e.target.closest('.act.share');
  if (sh) {
    const url = sh.dataset.url;
    const row = sh.closest('.row, .saved-item');
    const title = row ? row.querySelector('.headline').textContent : '';
    shareOrCopy({ title, text: title, url }, '記事URLをコピーしました');
    return;
  }
  const tag = e.target.closest('.tag');
  if (tag) {
    if (state.view === 'saved') {
      document.getElementById('savedSearch').value = tag.dataset.tag;
      renderSaved();
    } else {
      state.tag = state.tag === tag.dataset.tag ? null : tag.dataset.tag;
      render();
    }
    return;
  }
  const btn = e.target.closest('.disclose');
  if (btn) {
    const row = btn.closest('.row');
    const open = row.dataset.open !== 'true';
    if (open) state.open.add(row.dataset.url); else state.open.delete(row.dataset.url);
    row.dataset.open = String(open);
    btn.setAttribute('aria-expanded', String(open));
    row.querySelector('.detail').hidden = !open;
  }
}

// メモは打鍵のたびに書くと重いので、止まってから保存する
const memoTimers = new Map();
function onMemoInput(e) {
  const ta = e.target.closest('.memo textarea');
  if (!ta) return;
  const url = ta.dataset.url;
  const note = document.querySelector('.memo .state[data-for="' + CSS.escape(url) + '"]');
  if (note) note.textContent = '入力中…';
  clearTimeout(memoTimers.get(url));
  memoTimers.set(url, setTimeout(() => {
    if (Store.setMemo(url, ta.value) && note) {
      note.textContent = '保存しました';
      setTimeout(() => { if (note.textContent === '保存しました') note.textContent = ''; }, 1600);
    }
  }, 400));
}
document.getElementById('ledger').addEventListener('input', onMemoInput);
document.getElementById('savedList').addEventListener('input', onMemoInput);

document.getElementById('savedSearch').addEventListener('input', renderSaved);
document.getElementById('dateSelect').addEventListener('change', e =>
  go({ view: 'day', date: e.target.value }));
document.getElementById('prevDate').addEventListener('click', () => {
  const i = DATES.indexOf(state.date);
  if (i < DATES.length - 1) go({ view: 'day', date: DATES[i + 1] });
});
document.getElementById('nextDate').addEventListener('click', () => {
  const i = DATES.indexOf(state.date);
  if (i > 0) go({ view: 'day', date: DATES[i - 1] });
});
document.getElementById('strip').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) go({ view: 'day', date: b.dataset.date });
});

document.getElementById('exportBtn').addEventListener('click', () => {
  if (Store.count() === 0) { toast('保存済みがありません'); return; }
  const blob = new Blob([JSON.stringify(Store.all(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'signal-log-saved-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast(Store.count() + '件を書き出しました');
});
document.getElementById('importBtn').addEventListener('click', () =>
  document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    let items;
    try { items = JSON.parse(await file.text()); }
    catch (parseErr) { throw new Error('JSONとして読めないファイルです'); }
    if (!Array.isArray(items)) throw new Error('「保存済みを書き出す」で作ったファイルを選んでください');
    // 取り込みは既存に足す。同じURLは、メモが入っている方を残す
    const merged = {};
    Store.all().forEach(it => { merged[it.url] = it; });
    let added = 0;
    items.forEach(it => {
      const url = safeUrl(it && it.url);
      if (url === '#') return;
      const cur = merged[url];
      if (!cur || (!cur.memo && it.memo)) { merged[url] = Object.assign({}, it, { url }); }
      if (!cur) added++;
    });
    Store.replaceAll(merged);
    toast(added + '件を追加しました（計 ' + Store.count() + '件）');
    render();
  } catch (err) { toast('読み込めませんでした: ' + err.message); }
  finally { e.target.value = ''; }
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('signallog:theme', next); } catch (e) {}
});

document.getElementById('brandLink').addEventListener('click', e => {
  e.preventDefault();
  go({ view: 'day', date: DATES[0], source: 'all' });
});

window.addEventListener('hashchange', applyHash);

/* ── 起動 ──────────────────────────────────────── */
try {
  const t = localStorage.getItem('signallog:theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch (e) {}

buildChrome();
Object.assign(state, parseHash());
writeHash(true);
render();
})();
</script>
